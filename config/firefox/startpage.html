<!doctype html>
<!-- Rendered by modules/home/firefox.nix: @NAME@ placeholders are replaced
     with design tokens from theme/base.nix (see .claude/rules/design.md).
     Firefox's new tab and home page: a clock, the date, a search field and
     quick links. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>New Tab</title>
    <style>
        :root {
            --fg: @FOREGROUND@;
            --bg: @BACKGROUND@;
            --muted: @MUTED@;
            --accent: @ACCENT@;
            --fill-rest: color-mix(in srgb, @FOREGROUND@ @FILL_REST@%, transparent);
            --fill-hover: color-mix(in srgb, @FOREGROUND@ @FILL_HOVER@%, transparent);
            --fill-pressed: color-mix(in srgb, @FOREGROUND@ @FILL_PRESSED@%, transparent);
            --rim: color-mix(in srgb, @FOREGROUND@ @RIM@%, transparent);
            --raised: color-mix(in srgb, @SURFACE@ @RAISED@%, transparent);
            --shadow-raised: 0 @RAISED_SHADOW_Y@px @RAISED_SHADOW_BLUR@px color-mix(in srgb, #000 @RAISED_SHADOW_OPACITY@%, transparent);
            --radius-medium: @RADIUS_MEDIUM@px;
            --radius-large: @RADIUS_LARGE@px;
            --fast: @DURATION_FAST@ms;
            --slow: @DURATION_SLOW@ms;
            /* OutBack-like spring for things entering; exits are not used. */
            --spring: cubic-bezier(0.34, 1.3, 0.64, 1);
            --out: cubic-bezier(0.33, 1, 0.68, 1);

            /* Component sizes for this page. */
            --clock-size: 104px;
            --field-width: 560px;
            --field-height: 52px;
            --tile-width: 96px;
            --tile-height: 88px;
            --favicon: 28px;
            --icon: 22px;
            --lift: 2px;
            --stagger: 40ms;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            /* Solid, like every web page: Firefox can only show page content
               through to the blur via browser.tabs.allow_transparent_browser,
               which also turns sites without their own background
               transparent (unreadable). */
            background: var(--bg);
            color: var(--fg);
            font-family: "@FONT@", sans-serif;
            font-variant-numeric: tabular-nums;
        }

        main {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: @SPACING_LARGE@px;
            /* Optically centred: a little above the middle. */
            padding-bottom: 8vh;
        }

        /* Everything springs up into place, one after another. */
        .enter {
            opacity: 0;
            transform: translateY(@SPACING_MEDIUM@px);
            animation: enter var(--slow) var(--spring) forwards;
        }

        .enter:nth-child(2) { animation-delay: var(--stagger); }
        .enter:nth-child(3) { animation-delay: calc(2 * var(--stagger)); }
        .enter:nth-child(4) { animation-delay: calc(3 * var(--stagger)); }

        @keyframes enter {
            to {
                opacity: 1;
                transform: none;
            }
        }

        .clock {
            font-size: var(--clock-size);
            font-weight: 300;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .date {
            margin-top: calc(-1 * @SPACING_SMALL@px);
            color: var(--muted);
            font-size: @FONT_TITLE@px;
        }

        /* Search: a frosted field with a light rim; accent rim when focused. */
        form {
            width: min(var(--field-width), 80vw);
            margin-top: @SPACING_LARGE@px;
        }

        .field {
            display: flex;
            align-items: center;
            gap: @SPACING_MEDIUM@px;
            height: var(--field-height);
            padding: 0 @SPACING_LARGE@px;
            border-radius: var(--radius-medium);
            background: var(--fill-rest);
            border: 1px solid var(--rim);
            transition: background-color var(--fast) var(--out),
                border-color var(--fast) var(--out);
        }

        .field:hover {
            background: var(--fill-hover);
        }

        .field:focus-within {
            background: var(--raised);
            border-color: var(--accent);
        }

        .icon {
            font-family: "Material Symbols Rounded";
            font-size: var(--icon);
            font-variation-settings: "FILL" 0, "wght" @ICON_WEIGHT@, "opsz" 24;
            color: var(--muted);
            line-height: 1;
            user-select: none;
        }

        input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: var(--fg);
            font: inherit;
            font-size: @FONT_SIZE@px;
        }

        input::placeholder {
            color: var(--muted);
        }

        /* Quick links: frosted tiles that lift on hover and press down. */
        nav {
            display: flex;
            gap: @SPACING_MEDIUM@px;
            margin-top: @SPACING_SMALL@px;
        }

        .tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: @SPACING_SMALL@px;
            width: var(--tile-width);
            height: var(--tile-height);
            border-radius: var(--radius-medium);
            background: var(--fill-rest);
            border: 1px solid color-mix(in srgb, @FOREGROUND@ @FILL_RIM@%, transparent);
            color: var(--muted);
            font-size: @FONT_CAPTION@px;
            text-decoration: none;
            transition: background-color var(--fast) var(--out),
                transform var(--fast) var(--out),
                box-shadow var(--fast) var(--out),
                color var(--fast) var(--out);
        }

        .tile:hover,
        .tile:focus-visible {
            background: var(--fill-hover);
            color: var(--fg);
            transform: translateY(calc(-1 * var(--lift)));
            box-shadow: var(--shadow-raised);
            outline: none;
        }

        .tile:active {
            background: var(--fill-pressed);
            transform: scale(@PRESS_SCALE@);
            box-shadow: none;
        }

        .tile img {
            width: var(--favicon);
            height: var(--favicon);
            border-radius: @RADIUS_SMALL@px;
        }
    </style>
</head>
<body>
    <main>
        <div class="clock enter" id="clock"></div>
        <div class="date enter" id="date"></div>
        <form class="enter" id="search" autocomplete="off">
            <label class="field">
                <span class="icon">search</span>
                <input id="query" type="text" placeholder="Search or type a URL" autofocus>
            </label>
        </form>
        <nav class="enter">@LINKS@</nav>
    </main>

    <script>
        const clock = document.getElementById("clock");
        const date = document.getElementById("date");

        function tick() {
            const now = new Date();
            clock.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
            date.textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
            // Wake up again right at the next minute.
            setTimeout(tick, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()));
        }
        tick();

        // Addresses open directly; anything else is a search.
        document.getElementById("search").addEventListener("submit", event => {
            event.preventDefault();
            const text = document.getElementById("query").value.trim();
            if (!text)
                return;
            const looksLikeUrl = /^[a-z][a-z0-9+.-]*:\/\//i.test(text)
                || (!/\s/.test(text) && /^[^\s/]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(text))
                || /^localhost(:\d+)?(\/.*)?$/i.test(text);
            location.href = looksLikeUrl
                ? (/^[a-z][a-z0-9+.-]*:\/\//i.test(text) ? text : "https://" + text)
                : "@SEARCH_URL@" + encodeURIComponent(text);
        });
    </script>
</body>
</html>
