# Rendered by modules/home/hyprlock.nix: @NAME@ placeholders are replaced with
# theme values and script store paths at build time.

general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
}

background {
    monitor =
    path = @WALLPAPER@
    color = rgb(@BACKGROUND_HEX@)
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.58
    vibrancy = 0.12
}

label {
    monitor =
    text = cmd[update:1000] @DATE@ +"%H:%M"
    color = rgb(@FOREGROUND_HEX@)
    font_size = 104
    font_family = @FONT@
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] @DATE@ +"%A, %d %B"
    color = rgb(@MUTED_HEX@)
    font_size = 23
    font_family = @FONT@
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 520, 72
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgb(@ACCENT_HEX@)
    inner_color = rgba(@SURFACE_HEX@@RAISED_ALPHA@)
    font_color = rgb(@FOREGROUND_HEX@)
    check_color = rgb(@BLUE_HEX@)
    fail_color = rgb(@RED_HEX@)
    fade_on_empty = false
    placeholder_text = <span foreground="##@MUTED_HEX@">Password</span>
    fail_text = <span foreground="##@RED_HEX@">$FAIL</span>
    rounding = @RADIUS_LARGE@
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] @KEYBOARD_LAYOUT@
    color = rgb(@FOREGROUND_HEX@)
    font_size = 22
    font_family = @FONT@
    position = -170, -30
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:10000] @BATTERY_STATUS@
    color = rgb(@FOREGROUND_HEX@)
    font_size = 22
    font_family = @FONT@
    position = -36, -30
    halign = right
    valign = top
}
